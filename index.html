<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Hard Fact Music — Українська музика</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Ruslan+Display&display=swap" rel="stylesheet">
<style>
/* ============================================
   Hard Fact Music — Design tokens & base
   ============================================ */
:root {
  --bg: #0a0a0a;
  --bg-1: #101010;
  --bg-2: #141414;
  --card: #171717;
  --hairline: rgba(255,255,255,0.07);
  --hairline-strong: rgba(255,255,255,0.14);
  --text: #f4f4f2;
  --text-dim: #a4a49f;
  --text-muted: #6d6d68;
  --accent-yellow: #ffd60a;
  --accent-blue: #0057b7;
  --accent-red: #e63946;

  /* accent role — overridden per scheme */
  --accent: var(--accent-yellow);
  --accent-2: var(--accent-blue);
  --accent-text: #0a0a0a;

  --row-h: 64px;
  --pad-y: clamp(40px, 5vw, 72px);

  --mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
  --sans: 'Manrope', system-ui, -apple-system, sans-serif;
}

[data-scheme="flag"] {
  --accent: #ffd60a;
  --accent-2: #0057b7;
  --accent-text: #0a0a0a;
}
[data-scheme="mono-yellow"] {
  --accent: #ffd60a;
  --accent-2: #ffd60a;
  --accent-text: #0a0a0a;
}
[data-scheme="mono-blue"] {
  --accent: #4b9dff;
  --accent-2: #4b9dff;
  --accent-text: #0a0a0a;
}

[data-density="compact"] { --row-h: 52px; --pad-y: clamp(48px, 6vw, 88px); }

/* Per-section wave tints — blue at top, transitioning to yellow at bottom */
.hero     { --tint-a: rgba(90,165,255,0.50); --tint-b: rgba(0,87,183,0.42);  --tint-c: rgba(0,45,110,0.30); }
#releases { --tint-a: rgba(0,110,210,0.38);  --tint-b: rgba(0,60,140,0.32);  --tint-c: rgba(0,30,80,0.24); }
#tracks   { --tint-a: rgba(190,150,15,0.30); --tint-b: rgba(150,115,8,0.28); --tint-c: rgba(95,72,0,0.22); }
#shop     { --tint-a: rgba(255,214,10,0.46); --tint-b: rgba(230,185,8,0.38); --tint-c: rgba(160,128,0,0.28); }

.hero, #releases, #tracks, #shop { position: relative; overflow: hidden; }
.hero::before, #releases::before, #tracks::before, #shop::before {
  content: '';
  position: absolute;
  inset: -15% -10%;
  z-index: 0;
  pointer-events: none;
  filter: blur(70px);
  background:
    radial-gradient(42% 55% at 18% 28%, var(--tint-a) 0%, transparent 72%),
    radial-gradient(48% 48% at 82% 68%, var(--tint-b) 0%, transparent 72%),
    radial-gradient(38% 38% at 50% 100%, var(--tint-c) 0%, transparent 72%);
  background-size: 160% 160%;
  animation: waveFlow 24s ease-in-out infinite alternate;
}
.hero > .container, #releases > .container, #tracks > .container, #shop > .container {
  position: relative; z-index: 1;
}
@keyframes waveFlow {
  0%   { background-position: 0% 10%, 100% 90%, 50% 100%; }
  50%  { background-position: 25% 30%, 75% 70%, 55% 85%; }
  100% { background-position: 10% 45%, 90% 55%, 45% 90%; }
}
@media (prefers-reduced-motion: reduce) {
  .hero::before, #releases::before, #tracks::before, #shop::before { animation: none; }
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); }
body {
  font-family: var(--sans);
  font-feature-settings: "ss01","cv11";
  -webkit-font-smoothing: antialiased;
  padding-bottom: 100px; /* room for sticky player */
}

a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; }
img { display: block; max-width: 100%; }

.container {
  max-width: 1400px;
  margin: 0 auto;
  padding: 0 clamp(20px, 4vw, 56px);
}

.mono { font-family: var(--mono); letter-spacing: 0.02em; }
.uppercase { text-transform: uppercase; letter-spacing: 0.08em; }
.dim { color: var(--text-dim); }
.muted { color: var(--text-muted); }

/* ============================================
   Top bar
   ============================================ */
.topbar {
  position: sticky; top: 0; z-index: 40;
  background: rgba(10,10,10,0.85);
  backdrop-filter: blur(14px) saturate(1.1);
  -webkit-backdrop-filter: blur(14px) saturate(1.1);
  border-bottom: 1px solid var(--hairline);
}
.topbar-inner {
  display: flex; align-items: center; justify-content: space-between;
  height: 68px;
}
.brand { display: flex; align-items: center; gap: 14px; }
.brand-mark {
  width: 40px; height: 40px;
  object-fit: contain;
  display: block;
  filter: drop-shadow(0 0 6px rgba(255,214,10,0.25));
}
.brand-name {
  font-weight: 800; font-size: 15px;
  letter-spacing: 0.02em;
  text-transform: uppercase;
}
.brand-name em { color: var(--accent); font-style: normal; }
.brand-sub {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.14em;
  margin-top: 2px;
}
.nav { display: flex; align-items: center; gap: 4px; }
.nav a {
  padding: 8px 14px;
  font-size: 13px; font-weight: 500;
  color: var(--text-dim);
  border-radius: 2px;
}
.nav a:hover { color: var(--text); }
.topbar-right { display: flex; align-items: center; gap: 8px; }
.lang-toggle {
  display: flex; border: 1px solid var(--hairline-strong);
  border-radius: 2px; overflow: hidden;
  font-family: var(--mono); font-size: 11px;
}
.lang-toggle button {
  background: transparent; color: var(--text-dim);
  border: 0; padding: 6px 10px;
  text-transform: uppercase; letter-spacing: 0.08em;
}
.lang-toggle button.on {
  background: var(--text); color: var(--bg);
}
.cart-btn {
  display: flex; align-items: center; gap: 8px;
  background: transparent;
  border: 1px solid var(--hairline-strong);
  color: var(--text);
  padding: 8px 14px;
  border-radius: 2px;
  font-size: 12px; font-weight: 600;
  font-family: var(--mono);
  text-transform: uppercase; letter-spacing: 0.08em;
}
.cart-btn:hover { border-color: var(--accent); color: var(--accent); }
.cart-btn .cart-count {
  background: var(--accent); color: var(--accent-text);
  padding: 1px 6px;
  font-size: 11px; font-weight: 700;
  border-radius: 999px;
  min-width: 18px; text-align: center;
}

/* ============================================
   Hero
   ============================================ */
.hero { padding: var(--pad-y) 0 calc(var(--pad-y) - 24px); position: relative; overflow: hidden; }
.hero .container {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(320px, 420px);
  gap: clamp(32px, 5vw, 64px);
  align-items: center;
}
@media (max-width: 900px) {
  .hero .container { grid-template-columns: 1fr; }
}
.hero-meta {
  display: flex; align-items: center; gap: 14px;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.14em;
  margin-bottom: 32px;
}
.hero-meta .dot { width: 6px; height: 6px; background: var(--accent); border-radius: 50%; display: inline-block; }
.hero-meta .live-dot { background: var(--accent-red); box-shadow: 0 0 0 4px rgba(230,57,70,0.15); animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

.hero h1 {
  font-size: clamp(38px, 6vw, 84px);
  line-height: 0.95;
  font-family: 'Ruslan Display', 'Times New Roman', serif;
  font-weight: 400;
  letter-spacing: 0;
  margin: 0 0 14px;
  text-wrap: balance;
  color: #9d0712;
  background: linear-gradient(180deg, #ff8b82 0%, #d71925 28%, #8b0611 60%, #4a0209 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  text-shadow: 0 1px 0 #ffb0a8, 0 3px 0 #70030c, 0 6px 0 #430008, 0 10px 14px rgba(0,0,0,0.7), 0 0 18px rgba(186,0,18,0.35);
}
.hero h1 .accent {
  color: inherit;
  background: inherit;
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}
.hero h1 .stroke {
  color: inherit;
  -webkit-text-stroke: 1px #ffb0a8;
}
/* ============================================
   HFM Radio widget — vintage tube-radio look
   ============================================ */
.hero-radio { display: flex; justify-content: center; }
.radio-unit {
  position: relative;
  width: 100%;
  max-width: 400px;
  background:
    radial-gradient(120% 140% at 50% -20%, rgba(230,57,70,0.14) 0%, transparent 60%),
    linear-gradient(180deg, #140505 0%, #0a0202 55%, #050101 100%);
  border: 1px solid #3a0d10;
  border-radius: 18px;
  padding: 22px 22px 26px;
  box-shadow:
    0 0 0 1px rgba(230,57,70,0.08),
    0 20px 50px rgba(0,0,0,0.55),
    inset 0 1px 0 rgba(255,255,255,0.04);
}
.radio-unit__label {
  display: flex; align-items: center; gap: 10px;
  font-family: var(--mono);
  font-size: 11px;
  color: #ff9d97;
  text-transform: uppercase;
  letter-spacing: 0.16em;
  margin-bottom: 14px;
}
.radio-unit__logo {
  display: block;
  width: 100%;
  max-width: 260px;
  margin: 0 auto 16px;
  filter: drop-shadow(0 6px 18px rgba(0,0,0,0.6));
}
.radio-unit__grille {
  height: 34px;
  margin: 0 4px 14px;
  border-radius: 4px;
  background:
    repeating-linear-gradient(90deg, #2a0a0c 0 3px, #0c0202 3px 6px);
  box-shadow: inset 0 2px 6px rgba(0,0,0,0.6);
}
.radio-unit__freq {
  display: flex; justify-content: space-between;
  padding: 0 4px;
  margin-bottom: 20px;
  font-family: var(--mono);
  font-size: 10px;
  color: #7a2c2f;
  letter-spacing: 0.04em;
}
.radio-unit__play {
  position: relative;
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  padding: 20px 16px 16px;
  border: 1px solid #ff625f;
  border-radius: 12px;
  background: linear-gradient(180deg, #b0121f 0%, #7c0510 100%);
  color: #fff5f3;
  cursor: pointer;
  box-shadow: 0 6px 0 #3f0007, 0 14px 26px rgba(0,0,0,0.4);
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}
.radio-unit__play:hover { transform: translateY(-1px); }
.radio-unit__play:active { transform: translateY(4px); box-shadow: 0 2px 0 #3f0007; }
.radio-unit__play-label {
  display: flex; align-items: center; gap: 10px;
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.12em;
}
.radio-unit__vu {
  display: flex; align-items: flex-end; gap: 3px;
  height: 22px;
}
.radio-unit__vu i {
  width: 4px;
  border-radius: 1px;
  background: #ffb0a8;
  height: 5px;
  opacity: 0.55;
}
.radio-unit.is-playing .radio-unit__vu i {
  animation: vuBounce 0.9s ease-in-out infinite;
  opacity: 1;
}
@keyframes vuBounce {
  0%, 100% { height: 4px; }
  50% { height: 20px; }
}
.radio-unit__now {
  margin-top: 14px;
  text-align: center;
  font-family: var(--mono);
  font-size: 11px;
  color: #a35b57;
  letter-spacing: 0.04em;
  min-height: 14px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.hero-en {
  font-family: var(--mono);
  font-size: clamp(10px, 1.1vw, 12px);
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.16em;
  margin: -4px 0 0;
  max-width: 700px;
  line-height: 1.6;
}
.hero-links {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  margin-top: 16px;
  flex-wrap: wrap;
}
.hero-links__item {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.hero-links__hint {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--text-muted);
  letter-spacing: 0.04em;
  padding-left: 4px;
}
.hero-links a {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 9px 16px;
  border: 1px solid var(--hairline-strong);
  border-radius: 999px;
  color: var(--text-dim);
  font-family: var(--mono);
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  transition: border-color 0.15s ease, color 0.15s ease, transform 0.15s ease;
}
.hero-links a:hover {
  color: var(--text);
  border-color: var(--accent);
  transform: translateY(-1px);
}

.hero-stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  border-top: 1px solid var(--hairline);
  border-bottom: 1px solid var(--hairline);
}
.hero-stats > div {
  padding: 28px 24px 24px;
  border-right: 1px solid var(--hairline);
}
.hero-stats > div:last-child { border-right: 0; }
.hero-stats .n {
  font-size: clamp(32px, 4vw, 52px);
  font-weight: 700;
  letter-spacing: -0.03em;
  line-height: 1;
}
.hero-stats .n .unit {
  font-size: 0.4em;
  color: var(--text-muted);
  font-family: var(--mono);
  font-weight: 500;
  margin-left: 8px;
  vertical-align: middle;
  text-transform: uppercase;
  letter-spacing: 0.12em;
}
.hero-stats .lbl {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.14em;
  margin-top: 12px;
}

/* Marquee variant */
.marquee {
  overflow: hidden;
  padding: 20px 0;
  border-top: 1px solid var(--hairline);
  border-bottom: 1px solid var(--hairline);
  margin: 40px 0;
  background: var(--bg-1);
}
.marquee-track {
  display: flex; gap: 48px;
  animation: scroll 40s linear infinite;
  white-space: nowrap;
  will-change: transform;
}
.marquee-track span {
  font-size: clamp(24px, 3vw, 44px);
  font-weight: 800;
  letter-spacing: -0.03em;
}
.marquee-track span:nth-child(odd) { color: var(--text); }
.marquee-track span:nth-child(even) { color: var(--accent); }
.marquee-track .sep {
  color: var(--text-muted);
  font-size: 0.6em;
  align-self: center;
  font-family: var(--mono);
}
@keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }

/* ============================================
   Section header
   ============================================ */
.section { padding: var(--pad-y) 0; border-top: 1px solid var(--hairline); }
.section-head {
  display: flex; align-items: flex-end; justify-content: space-between;
  margin-bottom: 24px;
  gap: 24px;
}
.section-num {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.16em;
  margin-bottom: 8px;
}
.section-num::before { content: '— '; }
.section h2 {
  font-size: clamp(26px, 3.4vw, 44px);
  line-height: 0.98;
  font-weight: 800;
  letter-spacing: -0.02em;
  margin: 0;
  text-wrap: balance;
}
.section h2 .en {
  display: block;
  font-family: var(--mono);
  font-size: 0.24em;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.14em;
  margin-top: 12px;
  font-weight: 500;
}
.section-cta {
  font-family: var(--mono);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  color: var(--text-dim);
  padding-bottom: 6px;
  border-bottom: 1px solid var(--hairline-strong);
  white-space: nowrap;
}
.section-cta:hover { color: var(--accent); border-color: var(--accent); }

/* ============================================
   Featured release
   ============================================ */
.featured {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 1.1fr;
  gap: 48px;
  align-items: center;
}
.featured-art {
  aspect-ratio: 1/1;
  background: var(--bg-2);
  border: 1px solid var(--hairline);
  position: relative;
  overflow: hidden;
}
.featured-art video.featured-video {
  width: 100%; height: 100%; display: block;
  object-fit: cover; background: #000;
}
.featured-tag {
  position: absolute; top: 20px; left: 20px;
  background: var(--accent);
  color: var(--accent-text);
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  padding: 6px 10px;
  z-index: 2;
}
.featured-meta {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.14em;
  margin-bottom: 20px;
}
.featured h3 {
  font-size: clamp(40px, 5.5vw, 78px);
  line-height: 0.95;
  font-weight: 800;
  letter-spacing: -0.035em;
  margin: 0 0 12px;
}
.featured .artist {
  font-size: clamp(16px, 1.6vw, 20px);
  color: var(--text-dim);
  margin-bottom: 32px;
  font-weight: 500;
}
.featured .artist::before {
  content: '↳ ';
  color: var(--accent);
  font-family: var(--mono);
}
.featured p {
  color: var(--text-dim);
  font-size: 15px;
  line-height: 1.6;
  max-width: 480px;
  margin: 0 0 40px;
}
.featured-actions { display: flex; gap: 12px; flex-wrap: wrap; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; gap: 10px;
  padding: 14px 22px;
  background: var(--text);
  color: var(--bg);
  border: 0;
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  border-radius: 2px;
  transition: transform 0.15s ease;
}
.btn:hover { transform: translateY(-1px); }
.btn-primary { background: var(--accent); color: var(--accent-text); }
.btn-outline {
  background: transparent;
  color: var(--text);
  border: 1px solid var(--hairline-strong);
}
.btn-outline:hover { border-color: var(--accent); color: var(--accent); }
.btn-lg { padding: 18px 28px; font-size: 13px; }

/* ============================================
   Tracklist
   ============================================ */
.tracks-header {
  display: grid;
  grid-template-columns: 40px 56px 3fr 2fr 1fr 100px 80px 120px;
  gap: 16px;
  padding: 10px 16px;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.14em;
  border-bottom: 1px solid var(--hairline);
}
.track-row {
  display: grid;
  grid-template-columns: 40px 56px 3fr 2fr 1fr 100px 80px 120px;
  gap: 16px;
  align-items: center;
  padding: 12px 16px;
  border-bottom: 1px solid var(--hairline);
  transition: background 0.12s ease;
  min-height: var(--row-h);
}
.track-row:hover { background: rgba(255,255,255,0.025); }
.track-row.playing { background: rgba(255,214,10,0.06); }
.track-row.playing .t-title { color: var(--accent); }

.t-num {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--text-muted);
  position: relative;
}
.t-num .play-btn {
  position: absolute; inset: 0;
  background: transparent; border: 0;
  color: var(--text);
  opacity: 0;
  display: grid; place-items: center;
  transition: opacity 0.12s ease;
}
.track-row:hover .t-num .num-txt { opacity: 0; }
.track-row:hover .t-num .play-btn { opacity: 1; }
.track-row.playing .t-num .num-txt { opacity: 0; }
.track-row.playing .t-num .play-btn { opacity: 1; color: var(--accent); }

.t-cover {
  width: 44px; height: 44px;
  background: var(--bg-2);
  border: 1px solid var(--hairline);
  overflow: hidden;
  position: relative;
}
.t-cover image-slot { width: 100%; height: 100%; }
.t-title {
  font-weight: 600; font-size: 14px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.t-title .en {
  display: block;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.12em;
  font-weight: 500;
  margin-top: 2px;
}
.t-artist {
  color: var(--text-dim);
  font-size: 13px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.t-duration {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--text-muted);
}
.t-wave {
  display: flex; align-items: center; gap: 2px;
  height: 28px;
}
.t-wave .bar {
  flex: 1;
  background: var(--hairline-strong);
  min-width: 2px;
  border-radius: 1px;
}
.track-row.playing .t-wave .bar { background: var(--accent); }
.t-price {
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 600;
  text-align: right;
}
.t-buy {
  background: transparent;
  border: 1px solid var(--hairline-strong);
  color: var(--text);
  padding: 8px 12px;
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  border-radius: 2px;
  transition: all 0.12s ease;
}
.t-buy:hover { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
.t-buy.in-cart {
  background: var(--accent); color: var(--accent-text); border-color: var(--accent);
}

/* ============================================
   Shop (bundles)
   ============================================ */
.bundles {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 340px));
  justify-content: center;
  gap: 20px;
}
.bundle {
  border: 1px solid var(--hairline);
  padding: 32px;
  background: var(--bg-1);
  display: flex; flex-direction: column;
  position: relative;
  transition: border-color 0.15s ease;
}
.bundle:hover { border-color: var(--hairline-strong); }
.bundle.highlight { border-color: var(--accent); }
.bundle.highlight::before {
  content: 'РЕКОМЕНДОВАНО / RECOMMENDED';
  position: absolute; top: -10px; left: 24px;
  background: var(--accent); color: var(--accent-text);
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 700;
  padding: 4px 10px;
  letter-spacing: 0.12em;
}
.bundle-name {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.14em;
  margin-bottom: 16px;
}
.bundle h3 {
  font-size: 28px;
  font-weight: 800;
  letter-spacing: -0.02em;
  margin: 0 0 8px;
  line-height: 1.1;
}
.bundle .en {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.12em;
  margin-bottom: 28px;
}
.bundle-price {
  font-size: 44px;
  font-weight: 800;
  letter-spacing: -0.03em;
  margin-bottom: 4px;
}
.bundle-price .curr { font-size: 22px; color: var(--text-dim); margin-right: 6px; font-weight: 600; }
.bundle-note {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.12em;
  margin-bottom: 32px;
}
.bundle ul {
  list-style: none; padding: 0; margin: 0 0 32px;
  border-top: 1px solid var(--hairline);
}
.bundle li {
  padding: 12px 0;
  border-bottom: 1px solid var(--hairline);
  font-size: 13px;
  color: var(--text-dim);
  display: flex; align-items: flex-start; gap: 10px;
}
.bundle li::before {
  content: '+';
  color: var(--accent);
  font-family: var(--mono);
  font-weight: 700;
  flex-shrink: 0;
}
.bundle .btn { justify-content: center; margin-top: auto; }

/* ============================================
   Donate section
   ============================================ */
.donate {
  border: 1px solid var(--hairline-strong);
  padding: clamp(32px, 5vw, 64px);
  background: linear-gradient(180deg, var(--bg-1), var(--bg));
  position: relative;
  overflow: hidden;
}
.donate::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, var(--accent-blue) 0%, var(--accent-blue) 50%, var(--accent-yellow) 50%, var(--accent-yellow) 100%);
}
.donate-grid {
  display: grid;
  grid-template-columns: 1.2fr 1fr;
  gap: 56px;
  align-items: center;
}
.donate-grid--single {
  grid-template-columns: 1fr;
  max-width: 440px;
  margin: 0 auto;
  text-align: center;
}
.donate-tag {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--accent-red);
  text-transform: uppercase;
  letter-spacing: 0.16em;
  margin-bottom: 20px;
  display: flex; align-items: center; gap: 8px;
}
.donate-tag .dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--accent-red);
  animation: pulse 1.6s infinite;
}
.donate h2 {
  font-size: clamp(36px, 4.8vw, 60px);
  line-height: 0.95;
  font-weight: 800;
  letter-spacing: -0.03em;
  margin: 0 0 16px;
}
.donate h2 .en {
  display: block;
  font-family: var(--mono);
  font-size: 0.22em;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.14em;
  margin-top: 12px;
  font-weight: 500;
}
.donate p {
  color: var(--text-dim);
  line-height: 1.6;
  margin: 0 0 32px;
  max-width: 460px;
}
.progress {
  margin-bottom: 28px;
}
.progress-labels {
  display: flex; justify-content: space-between;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.12em;
  margin-bottom: 10px;
}
.progress-labels .now {
  color: var(--accent-yellow);
  font-weight: 700;
}
.progress-bar {
  height: 8px;
  background: rgba(255,255,255,0.06);
  overflow: hidden;
  position: relative;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent-blue), var(--accent-yellow));
  transition: width 1s ease;
}
.donate-amounts {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin-bottom: 20px;
}
.donate-support-label {
  font-family: var(--mono);
  font-size: 13px;
  color: var(--accent-yellow);
  text-transform: uppercase;
  letter-spacing: 0.14em;
  font-weight: 700;
  margin-bottom: 24px;
}
.donate-amount-input {
  display: flex;
  align-items: center;
  gap: 10px;
  border: 1px solid var(--hairline-strong);
  background: var(--bg-2);
  padding: 4px 18px;
  margin-bottom: 16px;
}
.donate-amount-input .curr {
  font-family: var(--mono);
  font-size: 20px;
  color: var(--text-muted);
}
.donate-amount-input input {
  flex: 1;
  background: transparent;
  border: 0;
  outline: none;
  color: var(--text);
  font-family: var(--mono);
  font-size: 20px;
  font-weight: 700;
  padding: 14px 0;
  text-align: center;
  -moz-appearance: textfield;
}
.donate-amount-input input::-webkit-outer-spin-button,
.donate-amount-input input::-webkit-inner-spin-button {
  -webkit-appearance: none; margin: 0;
}
.donate-amount-input input::placeholder { color: var(--text-muted); }
.donate-paused-note {
  margin-top: 12px;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text-muted);
  line-height: 1.5;
}
.amount-btn {
  padding: 16px 8px;
  background: transparent;
  border: 1px solid var(--hairline-strong);
  color: var(--text);
  font-family: var(--mono);
  font-size: 14px;
  font-weight: 700;
  transition: all 0.12s ease;
}
.amount-btn:hover, .amount-btn.on {
  background: var(--accent-yellow); color: var(--accent-text); border-color: var(--accent-yellow);
}
.donate-detail {
  border: 1px solid var(--hairline);
  padding: 24px;
  background: var(--bg-2);
}
.donate-detail-row {
  display: flex; justify-content: space-between;
  padding: 12px 0;
  border-bottom: 1px solid var(--hairline);
  font-family: var(--mono);
  font-size: 12px;
}
.donate-detail-row:last-child { border-bottom: 0; }
.donate-detail-row .k { color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em; }
.donate-detail-row .v { color: var(--text); font-weight: 600; }
.donate-detail h4 {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.14em;
  margin: 0 0 16px;
  font-weight: 500;
}

/* ============================================
   Footer
   ============================================ */
.reviews-empty {
  border: 1px dashed var(--hairline-strong);
  padding: clamp(40px, 6vw, 72px) 24px;
  text-align: center;
  color: var(--text-muted);
}
.reviews-empty-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 56px; height: 56px;
  border-radius: 50%;
  border: 1px solid var(--hairline-strong);
  color: var(--text-dim);
  margin-bottom: 18px;
}
.reviews-empty p {
  max-width: 420px;
  margin: 0 auto;
  line-height: 1.6;
}

.faq-list {
  max-width: 760px;
}
.faq-item {
  border-bottom: 1px solid var(--hairline);
}
.faq-item:first-child { border-top: 1px solid var(--hairline); }
.faq-question {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  padding: 22px 4px;
  background: transparent;
  border: 0;
  color: var(--text);
  font-size: 16px;
  font-weight: 600;
  text-align: left;
  cursor: pointer;
}
.faq-item.is-open .faq-question { color: var(--accent); }
.faq-toggle {
  flex-shrink: 0;
  font-family: var(--mono);
  font-size: 18px;
  color: var(--text-muted);
  width: 24px; height: 24px;
  display: flex; align-items: center; justify-content: center;
}
.faq-answer {
  padding: 0 28px 24px 4px;
  color: var(--text-dim);
  line-height: 1.6;
  max-width: 640px;
}

.btn.is-disabled,
.btn.is-disabled:hover {
  opacity: 0.4;
  cursor: not-allowed;
  background: var(--bg-2) !important;
  border-color: var(--hairline) !important;
  color: var(--text-muted) !important;
  transform: none !important;
}
.radio-unit__play.is-disabled {
  opacity: 0.4;
  cursor: not-allowed;
  filter: grayscale(0.6);
}
.radio-unit__play.is-disabled:hover,
.radio-unit__play.is-disabled:active {
  transform: none;
  box-shadow: 0 6px 0 #3f0007, 0 14px 26px rgba(0,0,0,0.4);
}
.footer {
  border-top: 1px solid var(--hairline);
  padding: 64px 0 40px;
  margin-top: 40px;
}
.footer-grid {
  display: grid;
  grid-template-columns: 2fr 1fr 1fr 1fr;
  gap: 48px;
  margin-bottom: 64px;
}
.footer h5 {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.16em;
  margin: 0 0 20px;
  font-weight: 500;
}
.footer ul { list-style: none; padding: 0; margin: 0; }
.footer li { margin-bottom: 10px; }
.footer li a { color: var(--text-dim); font-size: 13px; }
.footer li a:hover { color: var(--accent); }
.footer-brand h3 {
  font-size: clamp(48px, 6vw, 84px);
  font-weight: 800;
  letter-spacing: -0.035em;
  line-height: 0.9;
  margin: 0 0 12px;
}
.footer-brand h3 em { color: var(--accent); font-style: normal; }
.footer-brand p { color: var(--text-dim); max-width: 340px; line-height: 1.5; font-size: 13px; }
.footer-bottom {
  border-top: 1px solid var(--hairline);
  padding-top: 28px;
  display: flex; justify-content: space-between; align-items: center;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.14em;
}
.footer-bottom .slava { color: var(--accent-yellow); font-weight: 700; }

/* ============================================
   Sticky player
   ============================================ */
.player {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  height: 88px;
  background: rgba(15,15,15,0.96);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid var(--hairline-strong);
  z-index: 50;
  display: grid;
  grid-template-columns: minmax(220px, 1fr) minmax(0, 2fr) minmax(220px, 1fr);
  align-items: center;
  padding: 0 20px;
  gap: 24px;
}
.player-left { display: flex; align-items: center; gap: 14px; min-width: 0; }
.player-cover {
  width: 56px; height: 56px;
  background: var(--bg-2);
  border: 1px solid var(--hairline);
  flex-shrink: 0;
  overflow: hidden;
}
.player-cover image-slot { width: 100%; height: 100%; }
.player-info { min-width: 0; }
.player-title {
  font-size: 14px; font-weight: 600;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.player-artist {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  margin-top: 2px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.player-center {
  display: flex; flex-direction: column;
  align-items: center;
  gap: 8px;
  min-width: 0;
}
.player-controls { display: flex; align-items: center; gap: 20px; }
.player-controls button {
  background: transparent; border: 0;
  color: var(--text-dim);
  display: grid; place-items: center;
  padding: 4px;
  transition: color 0.12s ease;
}
.player-controls button:hover { color: var(--text); }
.player-controls .play-main {
  width: 36px; height: 36px;
  background: var(--text);
  color: var(--bg);
  border-radius: 50%;
}
.player-controls .play-main:hover { background: var(--accent); color: var(--accent-text); transform: scale(1.05); }
.player-progress {
  width: 100%;
  display: flex; align-items: center; gap: 10px;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--text-muted);
}
.player-progress-bar {
  flex: 1;
  height: 4px;
  background: rgba(255,255,255,0.08);
  border-radius: 2px;
  position: relative;
  cursor: pointer;
}
.player-progress-fill {
  height: 100%;
  background: var(--text);
  border-radius: 2px;
  position: relative;
}
.player-progress-bar:hover .player-progress-fill { background: var(--accent); }
.player-progress-fill::after {
  content: '';
  position: absolute; right: -5px; top: 50%;
  width: 10px; height: 10px;
  background: var(--accent);
  border-radius: 50%;
  transform: translateY(-50%) scale(0);
  transition: transform 0.15s ease;
}
.player-progress-bar:hover .player-progress-fill::after { transform: translateY(-50%) scale(1); }

.player-right {
  display: flex; align-items: center; gap: 12px;
  justify-content: flex-end;
}
.player-buy {
  background: var(--accent);
  color: var(--accent-text);
  border: 0;
  padding: 10px 16px;
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  border-radius: 2px;
  display: flex; align-items: center; gap: 6px;
}
.player-buy:hover { transform: translateY(-1px); }
.player-volume { display: flex; align-items: center; gap: 8px; }
.player-volume input[type="range"] {
  width: 80px;
  accent-color: var(--accent);
}
.player-empty {
  color: var(--text-muted);
  font-family: var(--mono);
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  padding-left: 20px;
}

/* Icons — inline svg helpers */
.icon { display: inline-block; width: 1em; height: 1em; vertical-align: -0.1em; }

/* ============================================
   Responsive
   ============================================ */
@media (max-width: 1000px) {
  .featured { grid-template-columns: 1fr; gap: 32px; }
  .bundles { grid-template-columns: 1fr; }
  .donate-grid { grid-template-columns: 1fr; gap: 32px; }
  .footer-grid { grid-template-columns: 1fr 1fr; }
  .hero-stats { grid-template-columns: repeat(2, 1fr); }
  .hero-stats > div:nth-child(2) { border-right: 0; }
  .hero-stats > div:nth-child(1),
  .hero-stats > div:nth-child(2) { border-bottom: 1px solid var(--hairline); }
  .nav { display: none; }
  .tracks-header { display: none; }
  .track-row {
    grid-template-columns: 48px 1fr auto;
    grid-template-areas:
      'cover title price'
      'cover artist buy';
    gap: 8px 12px;
    padding: 14px 12px;
  }
  .t-num, .t-duration, .t-wave { display: none; }
  .t-cover { grid-area: cover; }
  .t-title { grid-area: title; }
  .t-artist { grid-area: artist; }
  .t-price { grid-area: price; text-align: right; font-size: 12px; }
  .t-buy { grid-area: buy; }
  .player { grid-template-columns: 1fr auto; height: auto; padding: 12px; gap: 12px; }
  .player-center { grid-column: 1 / -1; order: 3; }
  .player-right { order: 2; }
  .player-buy .buy-label { display: none; }
  .player-volume { display: none; }
}

  <script type="text/babel">

// tweaks-panel.jsx
// Reusable Tweaks shell + form-control helpers.
//
// Owns the host protocol (listens for __activate_edit_mode / __deactivate_edit_mode,
// posts __edit_mode_available / __edit_mode_set_keys / __edit_mode_dismissed) so
// individual prototypes don't re-roll it. Ships a consistent set of controls so you
// don't hand-draw <input type="range">, segmented radios, steppers, etc.
//
// Usage (in an HTML file that loads React + Babel):
//
//   const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
//     "primaryColor": "#7A5AE0",
//     "palette": ["#7A5AE0", "#29261b", "#f6f4ef"],
//     "fontSize": 16,
//     "density": "regular",
//     "dark": false
//   }/*EDITMODE-END*/;
//
//   function App() {
//     const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
//     return (
//       <div style={{ fontSize: t.fontSize, color: t.primaryColor }}>
//         Hello
//         <TweaksPanel>
//           <TweakSection label="Typography" />
//           <TweakSlider label="Font size" value={t.fontSize} min={10} max={32} unit="px"
//                        onChange={(v) => setTweak('fontSize', v)} />
//           <TweakRadio  label="Density" value={t.density}
//                        options={['compact', 'regular', 'comfy']}
//                        onChange={(v) => setTweak('density', v)} />
//           <TweakSection label="Theme" />
//           <TweakColor  label="Primary" value={t.primaryColor}
//                        options={['#0F766E', '#2A6FDB', '#1F8A5B', '#7A5AE0']}
//                        onChange={(v) => setTweak('primaryColor', v)} />
//           <TweakColor  label="Palette" value={t.palette}
//                        options={[['#7A5AE0', '#29261b', '#f6f4ef'],
//                                  ['#475569', '#0f172a', '#f1f5f9']]}
//                        onChange={(v) => setTweak('palette', v)} />
//           <TweakToggle label="Dark mode" value={t.dark}
//                        onChange={(v) => setTweak('dark', v)} />
//         </TweaksPanel>
//       </div>
//     );
//   }
//
// ─────────────────────────────────────────────────────────────────────────────

const __TWEAKS_STYLE = `
  .twk-panel{position:fixed;right:16px;bottom:16px;z-index:2147483646;width:280px;
    max-height:calc(100vh - 32px);display:flex;flex-direction:column;
    transform:scale(var(--dc-inv-zoom,1));transform-origin:bottom right;
    background:rgba(250,249,247,.78);color:#29261b;
    -webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);
    border:.5px solid rgba(255,255,255,.6);border-radius:14px;
    box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 12px 40px rgba(0,0,0,.18);
    font:11.5px/1.4 ui-sans-serif,system-ui,-apple-system,sans-serif;overflow:hidden}
  .twk-hd{display:flex;align-items:center;justify-content:space-between;
    padding:10px 8px 10px 14px;cursor:move;user-select:none}
  .twk-hd b{font-size:12px;font-weight:600;letter-spacing:.01em}
  .twk-x{appearance:none;border:0;background:transparent;color:rgba(41,38,27,.55);
    width:22px;height:22px;border-radius:6px;cursor:default;font-size:13px;line-height:1}
  .twk-x:hover{background:rgba(0,0,0,.06);color:#29261b}
  .twk-body{padding:2px 14px 14px;display:flex;flex-direction:column;gap:10px;
    overflow-y:auto;overflow-x:hidden;min-height:0;
    scrollbar-width:thin;scrollbar-color:rgba(0,0,0,.15) transparent}
  .twk-body::-webkit-scrollbar{width:8px}
  .twk-body::-webkit-scrollbar-track{background:transparent;margin:2px}
  .twk-body::-webkit-scrollbar-thumb{background:rgba(0,0,0,.15);border-radius:4px;
    border:2px solid transparent;background-clip:content-box}
  .twk-body::-webkit-scrollbar-thumb:hover{background:rgba(0,0,0,.25);
    border:2px solid transparent;background-clip:content-box}
  .twk-row{display:flex;flex-direction:column;gap:5px}
  .twk-row-h{flex-direction:row;align-items:center;justify-content:space-between;gap:10px}
  .twk-lbl{display:flex;justify-content:space-between;align-items:baseline;
    color:rgba(41,38,27,.72)}

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', noDeckControls = false, children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  // Auto-inject a rail toggle when a <deck-stage> is on the page. The
  // toggle drives the deck's per-viewer _railVisible via window message;
  // state is mirrored from the same localStorage key the deck reads so
  // the control reflects reality across reloads. The mechanism is the
  // message — authors who want custom placement can post it directly
  // and pass noDeckControls to suppress this one.
  const hasDeckStage = React.useMemo(
    () => typeof document !== 'undefined' && !!document.querySelector('deck-stage'),
    [],
  );
  // deck-stage enables its rail in connectedCallback, but this panel can
  // mount before that element has upgraded. The initial read catches the
  // common case; the listener covers mounting first. (Older deck-stage.js
  // copies still wait for the host's __omelette_rail_enabled postMessage —
  // same listener handles those.)
  const [railEnabled, setRailEnabled] = React.useState(
    () => hasDeckStage && !!document.querySelector('deck-stage')?._railEnabled,
  );
  React.useEffect(() => {
    if (!hasDeckStage || railEnabled) return undefined;
    const onMsg = (e) => {
      if (e.data && e.data.type === '__omelette_rail_enabled') setRailEnabled(true);
    };
    window.addEventListener('message', onMsg);
    return () => window.removeEventListener('message', onMsg);
  }, [hasDeckStage, railEnabled]);
  const [railVisible, setRailVisible] = React.useState(() => {
    try { return localStorage.getItem('deck-stage.railVisible') !== '0'; } catch (e) { return true; }
  });
  const toggleRail = (on) => {
    setRailVisible(on);
    window.postMessage({ type: '__deck_rail_visible', on }, '*');
  };
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
          {hasDeckStage && railEnabled && !noDeckControls && (
            <TweakSection label="Deck">
              <TweakToggle label="Thumbnail rail" value={railVisible} onChange={toggleRail} />
            </TweakSection>
          )}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

// Typewriter-cycles through `suggestions`. Clicking the field while a
// suggestion is animating freezes it as ghost text; Tab accepts it into the
// input. Enter posts __edit_mode_chat (host drops the text into the chat
// composer for the user to send). After the cycle the static placeholder
// types in and "Ideas" appears — clicking asks for three more suggestions.
function TweakSuggestionBar({
  suggestions = [],
  placeholder = 'Describe a tweak…',
  ideasPrompt = 'Suggest three more tweak ideas for this design and update the suggestions on TweakSuggestionBar.',
}) {
  const [val, setVal] = React.useState('');
  const [ghost, setGhost] = React.useState('');
  const [focused, setFocused] = React.useState(false);
  const inputRef = React.useRef(null);
  const tw = useTwkTypewriter(suggestions, { placeholder, enabled: !val && !ghost && !focused });

  const freeze = () => {
    tw.markPlayed();
    if (val || ghost) return;
    const target = !tw.done ? suggestions[tw.idx] : '';
    if (target) setGhost(target);
    inputRef.current?.focus();
  };

  const submit = () => {
    const v = (val || ghost).trim();
    if (!v) return;
    __twkSendChat(v);
    setVal('');
    setGhost('');
  };

  const onKeyDown = (e) => {
    if (e.key === 'Tab' && ghost && !val) {
      e.preventDefault();
      setVal(ghost);
      setGhost('');
    } else if (e.key === 'Enter') {
      e.preventDefault();
      submit();
    } else if (e.key === 'Escape') {
      setGhost('');
    }
  };

  const requestIdeas = () => __twkSendChat(ideasPrompt);

  const showAnim = !val && !ghost && !focused && !tw.done;
  const showStatic = !val && !ghost && !focused && tw.done;

  return (
    <div className="twk-sugg" onMouseDown={freeze}>
      <div className="twk-sugg-field">
        <input
          ref={inputRef}
          value={val}
          placeholder={focused && !ghost ? placeholder : ''}
          onChange={(e) => { setVal(e.target.value); setGhost(''); }}
          onFocus={() => { setFocused(true); tw.markPlayed(); }}
          onBlur={() => { setFocused(false); if (!val) setGhost(''); }}
          onKeyDown={onKeyDown}
        />
        {showAnim && (
          <div className="twk-sugg-ghost">
            {tw.text}<span className="twk-sugg-caret" />
          </div>
        )}
        {showStatic && (
          <div className="twk-sugg-ghost">
            {tw.tail}{tw.tail.length < placeholder.length && <span className="twk-sugg-caret" />}
          </div>
        )}
        {ghost && !val && (
          <div className="twk-sugg-ghost hint">{ghost}</div>
        )}
      </div>
      {val || ghost ? (
        <button className="twk-sugg-send"
                onMouseDown={(e) => { e.stopPropagation(); e.preventDefault(); }}
                onClick={submit}>
          Add
        </button>
      ) : tw.done && !focused ? (
        <button className="twk-sugg-ideas"
                onMouseDown={(e) => { e.stopPropagation(); e.preventDefault(); }}
                onClick={requestIdeas}>
          Ideas <__TwkSpark />
        </button>
      ) : null}
    </div>
  );
}

// Minimal type→pause→erase cycler. Plays once per unique `items` content per
// session — a reload from a tweak-value write skips straight to done; a new
// suggestion set (after "Ideas") gets a fresh animation.
function useTwkTypewriter(items, { placeholder, typeMs = 35, eraseMs = 22, pauseMs = 1800, enabled = true } = {}) {
  // Dep mirrors the memo body verbatim so collidable joins like
  // ['a\nb','c'] vs ['a','b','c'] don't share a stale sessionStorage key
  // (gen-spark PR #28600 Bugbot R3 — minor divergence from Tiffany's
  // `items.join('\n')` dep; upstream report pending).
  const key = React.useMemo(() => '__twk_played:' + JSON.stringify(items), [JSON.stringify(items)]);
  const played = () => { try { return sessionStorage.getItem(key) === '1'; } catch { return false; } };

  const [text, setText] = React.useState('');
  const [tail, setTail] = React.useState(() => (items.length === 0 || played() ? placeholder : ''));
  const [idx, setIdx] = React.useState(0);
  const [done, setDone] = React.useState(() => items.length === 0 || played());
  const phase = React.useRef('type');
  const n = React.useRef(0);

  const markPlayed = React.useCallback(() => {
    try { sessionStorage.setItem(key, '1'); } catch {}
    setDone(true);
  }, [key]);

  React.useEffect(() => {
    const skip = items.length === 0 || played();
    setText(''); setIdx(0);
    setDone(skip);
    setTail(skip ? placeholder : '');
    phase.current = 'type'; n.current = 0;
  }, [key]);

  React.useEffect(() => {
    if (done || !enabled) return;
    const item = items[idx] ?? '';
    let t;
    const tick = () => {
      if (phase.current === 'type') {
        n.current++;
        setText(item.slice(0, n.current));
        if (n.current >= item.length) { phase.current = 'pause'; t = setTimeout(tick, pauseMs); }
        else t = setTimeout(tick, typeMs + Math.random() * 20);
      } else if (phase.current === 'pause') {
        phase.current = 'erase'; t = setTimeout(tick, eraseMs);
      } else {
        n.current--;
        setText(item.slice(0, n.current));
        if (n.current <= 0) {
          if (idx === items.length - 1) { markPlayed(); return; }
          phase.current = 'type'; setIdx((i) => i + 1);
        } else t = setTimeout(tick, eraseMs);
      }
    };
    phase.current = 'type'; n.current = 0; setText('');
    t = setTimeout(tick, 400);
    return () => clearTimeout(t);
  }, [idx, done, key, enabled, typeMs, eraseMs, pauseMs]);

  React.useEffect(() => {
    if (!done || tail === placeholder) return;
    let i = 0;
    const t = setInterval(() => {
      i++; setTail(placeholder.slice(0, i));
      if (i >= placeholder.length) clearInterval(t);
    }, 28);
    return () => clearInterval(t);
  }, [done, placeholder]);

  return { text, tail, idx, done, markPlayed };
}

function waveform(seed, count = 48) {
  const bars = [];
  let x = seed;
  for (let i = 0; i < count; i++) {
    x = (x * 9301 + 49297) % 233280;
    const rand = x / 233280;
    const env = Math.sin((i / count) * Math.PI) * 0.6 + 0.4;
    bars.push(Math.max(0.15, rand * env));
  }
  return bars;
}

/* ============================================
   Real HTML5 audio player
   (plays actual mp3 files instead of a synth demo)
   ============================================ */
function useAudioPlayer() {
  const audioRef = useRef(null);
  if (!audioRef.current && typeof Audio !== 'undefined') {
    audioRef.current = new Audio();
    audioRef.current.preload = 'metadata';
    audioRef.current.setAttribute('playsinline', '');
    audioRef.current.setAttribute('webkit-playsinline', '');
    audioRef.current.style.display = 'none';
  }

  const [playing, setPlaying] = useState(false);
  const [current, setCurrent] = useState(0);
  const [duration, setDuration] = useState(0);
  const [volume, setVolumeState] = useState(0.6);
  const [ended, setEnded] = useState(0);
  const [error, setError] = useState(null);

  useEffect(() => {
    const audio = audioRef.current;
    if (!audio) return;
    // Attaching the element to the DOM (even hidden) avoids playback
    // quirks some mobile browsers have with detached <audio> elements.
    if (!audio.parentNode) document.body.appendChild(audio);
    audio.volume = volume;
    const onTime = () => setCurrent(audio.currentTime);
    const onMeta = () => setDuration(audio.duration || 0);
    const onEnd = () => { setPlaying(false); setCurrent(0); setEnded(n => n + 1); };
    const onPlaying = () => setError(null);
    const onError = () => {
      setPlaying(false);
      setError('Не вдалося завантажити аудіо. Перевірте з’єднання і спробуйте ще раз.');
    };
    audio.addEventListener('timeupdate', onTime);
    audio.addEventListener('loadedmetadata', onMeta);
    audio.addEventListener('ended', onEnd);
    audio.addEventListener('playing', onPlaying);
    audio.addEventListener('error', onError);
    return () => {
      audio.removeEventListener('timeupdate', onTime);
      audio.removeEventListener('loadedmetadata', onMeta);
      audio.removeEventListener('ended', onEnd);
      audio.removeEventListener('playing', onPlaying);
      audio.removeEventListener('error', onError);
    };
  }, []);

  useEffect(() => {
    if (audioRef.current) audioRef.current.volume = volume;
  }, [volume]);

  const play = useCallback((url, fallbackDur = 0) => {
    const audio = audioRef.current;
    if (!audio) return;
    setError(null);
    if (audio.src.indexOf(url) === -1) {
      audio.src = url; // setting src already triggers loading — no need to also call load()
      setDuration(fallbackDur);
      setCurrent(0);
    }
    const playPromise = audio.play();
    if (playPromise && typeof playPromise.catch === 'function') {
      playPromise.catch((err) => {
        if (err && err.name === 'AbortError') return; // superseded by a newer play/pause call — not a real error
        setPlaying(false);
        setError(
          err && err.name === 'NotAllowedError'
            ? 'Браузер заблокував відтворення. Натисніть кнопку play ще раз.'
            : 'Не вдалося відтворити трек. Спробуйте ще раз.'
        );
      });
    }
    setPlaying(true);
  }, []);

  const pause = useCallback(() => {
    const audio = audioRef.current;
    if (!audio) return;
    audio.pause();
    setPlaying(false);
  }, []);

  const stop = useCallback(() => {
    const audio = audioRef.current;
    if (!audio) return;
    audio.pause();
    audio.currentTime = 0;
    setPlaying(false);
    setCurrent(0);
  }, []);

  const seek = useCallback((t) => {
    const audio = audioRef.current;
    if (!audio) return;
    audio.currentTime = t;
    setCurrent(t);
  }, []);

  const setVolume = useCallback((v) => setVolumeState(v), []);

  return { play, pause, stop, seek, setVolume, playing, current, duration, volume, ended, error };
}

/* ============================================
   Player context
   ============================================ */
const PlayerCtx = createContext(null);

function PlayerProvider({ children }) {
  const player = useAudioPlayer();
  const [track, setTrack] = useState(null);
  const [queue, setQueue] = useState([]);

  const parseDuration = (str) => {
    const [m, s] = str.split(':').map(Number);
    return m * 60 + s;
  };

  const playTrack = useCallback((t, list) => {
    if (list) setQueue(list);
    setTrack(t);
    player.play(t.audioUrl, parseDuration(t.duration));
  }, [player]);

  const toggle = useCallback(() => {
    if (!track) return;
    if (player.playing) player.pause();
    else player.play(track.audioUrl, parseDuration(track.duration));
  }, [track, player]);

  const next = useCallback(() => {
    if (!track || queue.length === 0) return;
    const idx = queue.findIndex(t => t.id === track.id);
    const nextIdx = (idx + 1) % queue.length;
    playTrack(queue[nextIdx]);
  }, [track, queue, playTrack]);

  const prev = useCallback(() => {
    if (!track || queue.length === 0) return;
    const idx = queue.findIndex(t => t.id === track.id);
    const prevIdx = (idx - 1 + queue.length) % queue.length;
    playTrack(queue[prevIdx]);
  }, [track, queue, playTrack]);

  const playRadio = useCallback(() => {
    if (TRACKS.length === 0) return;
    const shuffled = [...TRACKS].sort(() => Math.random() - 0.5);
    setQueue(shuffled);
    setTrack(shuffled[0]);
    player.play(shuffled[0].audioUrl, parseDuration(shuffled[0].duration));
  }, [player]);

  const lastEndedRef = useRef(0);
  useEffect(() => {
    if (player.ended > lastEndedRef.current) {
      lastEndedRef.current = player.ended;
      next();
    }
  }, [player.ended, next]);

  const value = {
    track,
    playing: player.playing,
    current: player.current,
    duration: player.duration,
    volume: player.volume,
    setVolume: player.setVolume,
    playTrack,
    playRadio,
    toggle,
    next,
    prev,
    seek: player.seek,
    error: player.error,
    stop: () => { player.stop(); setTrack(null); },
  };

  return <PlayerCtx.Provider value={value}>{children}</PlayerCtx.Provider>;
}

function usePlayer() {
  return useContext(PlayerCtx);
}

/* ============================================
   Sticky player UI
   ============================================ */
function formatTime(s) {
  if (!isFinite(s) || s < 0) s = 0;
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return `${m}:${String(sec).padStart(2, '0')}`;
}

function StickyPlayer({ onBuy, lang, inCart }) {
  const p = usePlayer();
  const barRef = useRef(null);

  const onSeek = (e) => {
    if (!p.track || !barRef.current || !p.duration) return;
    const rect = barRef.current.getBoundingClientRect();
    const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    const newTime = pct * p.duration;
    p.seek(newTime);
  };

  if (!p.track) {
    return (
      <div className="player">
        <div className="player-empty">
          {lang === 'ua'
            ? '◉ ОБЕРІТЬ ТРЕК ДЛЯ ПРОСЛУХОВУВАННЯ'
            : '◉ SELECT A TRACK TO LISTEN'}
        </div>
        <div />
        <div />
      </div>
    );
  }

  const pct = p.duration > 0 ? (p.current / p.duration) * 100 : 0;
  const isInCart = inCart(p.track.id);

  return (
    <div className="player">
      <div className="player-left">
        <div className="player-cover">
          <image-slot id={`track-${p.track.id}`} shape="rect"
            placeholder={lang === 'ua' ? 'Обкладинка' : 'Cover'}></image-slot>
        </div>
        <div className="player-info">
          <div className="player-title">
            {lang === 'ua' ? p.track.title : p.track.titleEn}
          </div>
          <div className="player-artist">
            {lang === 'ua' ? p.track.artist : p.track.artistEn} · {p.track.cat}
          </div>
        </div>
      </div>

      <div className="player-center">
        <div className="player-controls">
          <button title="Shuffle"><Icon.Shuffle style={{fontSize:14}} /></button>
          <button onClick={p.prev} title="Previous"><Icon.Prev style={{fontSize:18}} /></button>
          <button className="play-main" onClick={p.toggle} title={p.playing ? 'Pause' : 'Play'}>
            {p.playing ? <Icon.Pause style={{fontSize:18}} /> : <Icon.Play style={{fontSize:18, marginLeft: 2}} />}
          </button>
          <button onClick={p.next} title="Next"><Icon.Next style={{fontSize:18}} /></button>
          <button title="Repeat"><Icon.Repeat style={{fontSize:14}} /></button>
        </div>
        <div className="player-progress">
          <span className="mono">{formatTime(p.current)}</span>
          <div ref={barRef} className="player-progress-bar" onClick={onSeek}>
            <div className="player-progress-fill" style={{width: `${pct}%`}} />
          </div>
          <span className="mono">{p.track.duration}</span>
        </div>
      </div>

      <div className="player-right">
        <div className="player-volume">
          <Icon.Volume style={{fontSize: 14, color: 'var(--text-muted)'}} />
          <input
            type="range"
            min="0" max="1" step="0.01"
            value={p.volume}
            onChange={e => p.setVolume(parseFloat(e.target.value))}
          />
        </div>
        <button className="player-buy is-disabled" disabled title={lang === 'ua' ? 'Незабаром' : 'Coming soon'}>
          <Icon.Cart style={{fontSize: 13}} />
          <span className="buy-label">
            {lang === 'ua' ? 'Незабаром' : 'Coming soon'}
          </span>
        </button>
      </div>
    </div>
  );
}

function AuthModal({ lang, onClose, onAuthed }) {

  const [password, setPassword] = useState('');

    login: lang === 'ua' ? 'Вхід' : 'Log in',
    register: lang === 'ua' ? 'Реєстрація' : 'Register',
    email: 'Email',
    password: lang === 'ua' ? 'Пароль' : 'Password',
    name: lang === 'ua' ? "Ім'я (необов'язково)" : 'Name (optional)',
    submitLogin: lang === 'ua' ? 'Увійти' : 'Log in',
    submitRegister: lang === 'ua' ? 'Зареєструватися' : 'Register',

    passwordHint: lang === 'ua' ? 'Мінімум 6 символів' : 'At least 6 characters',
  };

  const submit = async (e) => {
    e.preventDefault();
    setError('');
    if (!email || !password) {
      setError(lang === 'ua' ? 'Заповніть email і пароль' : 'Fill in email and password');
      return;
    }

      return;

    setLoading(true);
    try {
      const res = await fetch(`/api/${mode}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(mode === 'register' ? { email, password, name } : { email, password }),

        setLoading(false);
        return;
      }
      onAuthed({ email: data.email, name: data.name });

      }}>
        <div style={{
          display: 'flex', justifyContent: 'space-between', alignItems: 'center',
          marginBottom: 20,
        }}>
          <div style={{fontSize: 20, fontWeight: 700}}>
            {mode === 'login' ? t.login : t.register}
          </div>
          <button onClick={onClose} style={{
            background: 'transparent', border: '1px solid var(--hairline-strong)',
            color: 'var(--text)', padding: '6px 12px',
            fontFamily: 'var(--mono)', fontSize: 10, textTransform: 'uppercase',
            letterSpacing: '0.12em', borderRadius: 2, cursor: 'pointer',
          }}>{t.close}</button>
        </div>

        <form onSubmit={submit}>
          {mode === 'register' && (
            <div style={{marginBottom: 14}}>
              <label style={labelStyle}>{t.name}</label>
              <input type="text" value={name} onChange={e => setName(e.target.value)}
                style={inputStyle} />
            </div>
          )}
          <div style={{marginBottom: 14}}>
            <label style={labelStyle}>{t.email}</label>
            <input type="email" required value={email} onChange={e => setEmail(e.target.value)}
              style={inputStyle} />
          </div>
          <div style={{marginBottom: 8}}>
            <label style={labelStyle}>{t.password}</label>
            <input type="password" required value={password} onChange={e => setPassword(e.target.value)}
              style={inputStyle} />
          </div>
          {mode === 'register' && (
            <div style={{fontSize: 11, color: 'var(--text-muted)', marginBottom: 18}}>{t.passwordHint}</div>
          )}
          {mode === 'login' && <div style={{marginBottom: 18}} />}

          {error && (
            <div style={{ color: '#ff6b6b', fontSize: 13, marginBottom: 14 }}>{error}</div>
          )}

          <button type="submit" disabled={loading} className="btn btn-primary btn-lg"
            style={{width: '100%', justifyContent: 'center', marginBottom: 14}}>
            {loading ? '···' : (mode === 'login' ? t.submitLogin : t.submitRegister)}
          </button>
        </form>

        <button onClick={() => { setMode(m => m === 'login' ? 'register' : 'login'); setError(''); }}
          style={{
            display: 'block', width: '100%', textAlign: 'center',
            background: 'transparent', border: 0, color: 'var(--text-dim)',
            fontSize: 13, cursor: 'pointer', textDecoration: 'underline',
          }}>
          {mode === 'login' ? t.switchToRegister : t.switchToLogin}
        </button>
      </div>
    </>
  );
}

/* ============================================
   Boot — wrap with PlayerProvider
   ============================================ */
function Root() {
  return (
    <PlayerProvider>
      <App />
    </PlayerProvider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root />);

  </script>
</body>
</html>
